spring.application.name=university-management-system
server.port=8080

# Database: defaults to in-memory H2 for quick local runs.
# docker compose overrides these with the PostgreSQL service.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ums;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Initial admin account (created on first start if no admin exists)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.full-name=System Administrator
app.admin.email=${ADMIN_EMAIL:admin@university.local}

server.error.include-message=always
