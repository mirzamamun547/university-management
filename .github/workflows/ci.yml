name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1) Unit tests (UserServiceTest, Mockito) + the MockMvc RBAC tests on in-memory H2.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # 2) Integration tests (*IT): whole app + a REAL PostgreSQL running as a Docker service container.
  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ums_test
          POSTGRES_USER: ums
          POSTGRES_PASSWORD: ums_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ums -d ums_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Spring Boot reads these and overrides the H2 settings in src/test/resources
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ums_test
      SPRING_DATASOURCE_USERNAME: ums
      SPRING_DATASOURCE_PASSWORD: ums_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -DskipUnitTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore

  # 3) Build the Docker image, start app + database with docker compose, smoke-test over HTTP.
  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image and start the stack
        run: docker compose up -d --build

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Container status and logs (on failure)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
